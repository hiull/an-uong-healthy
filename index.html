<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ăn uống healthy</title>
  <meta name="description" content="Thực đơn hôm nay cho người tập gym">
  <meta name="theme-color" content="#2f7d5b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ăn healthy">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <nav class="day-nav" aria-label="Chọn ngày">
      <button id="prev-day" class="nav-btn" aria-label="Ngày trước">‹</button>
      <div class="day-head">
        <h1 id="day-title">Đang tải…</h1>
        <button id="go-today" class="link-btn" hidden>Về hôm nay</button>
      </div>
      <button id="next-day" class="nav-btn" aria-label="Ngày sau">›</button>
    </nav>

    <section class="progress" aria-label="Tiến độ hôm nay">
      <div class="bar-row">
        <div class="bar-label"><span>Protein</span><span><b id="protein-eaten">0</b> / <span id="protein-planned">0</span> g</span></div>
        <div class="bar"><div id="protein-bar" class="bar-fill protein"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>Calo</span><span><b id="kcal-eaten">0</b> / <span id="kcal-planned">0</span> kcal</span></div>
        <div class="bar"><div id="kcal-bar" class="bar-fill kcal"></div></div>
      </div>
    </section>
  </header>

  <main id="meals" aria-live="polite"></main>

  <footer class="foot">
    <p>Số liệu calo và protein là ước lượng.</p>
    <p id="storage-warning" class="warn" hidden>Trình duyệt không cho lưu, tick sẽ mất khi tải lại.</p>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
